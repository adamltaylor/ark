name: "Build Replica's Ark Release"

# Replica's Ark: pushing a tag such as 0.1.252-replica.1 builds Ark for
# Linux x64, as upstream's release-linux.yml does, and publishes it as a
# release of this fork, as ark-<tag>-linux-x64.zip. See PATCHES.md.
on:
  push:
    tags:
      - '*-replica.*'

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # As upstream: old enough for every distribution Replica runs on.
      GLIBC_MAX_VERSION: '2.26'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          # The zig linker, to link against an old glibc, as upstream does.
          cargo install --locked cargo-zigbuild
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install ziglang

      - name: Compile Ark
        run: cargo zigbuild --target x86_64-unknown-linux-gnu.$GLIBC_MAX_VERSION --release

      - name: Create archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          cp "$GITHUB_WORKSPACE/crates/ark/NOTICE" NOTICE
          zip -Xry "$GITHUB_WORKSPACE/ark-$GITHUB_REF_NAME-linux-x64.zip" ark LICENSE NOTICE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ark-$GITHUB_REF_NAME-linux-x64.zip" \
            --verify-tag --title "Ark $GITHUB_REF_NAME" \
            --notes "Replica's Ark: upstream Ark with the patches listed in PATCHES.md."
